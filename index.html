<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Markdown to HTML Converter</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>

    <body>
        <h1>Markdown to HTML Converter</h1>
        <div id="tab-container">
            <div class="tab" id="inputTab">Markdown Input <button id="inputMax">Max</button></div>
            <div class="tab" id="htmlTab">Raw HTML Output <button id="htmlMax">Max</button></div>
            <div class="tab" id="previewTab">HTML Preview <button id="previewMax">Max</button></div>
        </div>
        <div id="main-container">
            <div class="container maximized" id="inputContainer">
                <h2>Markdown Input:</h2>
                <textarea
                    id="markdown-input"
                    placeholder="Enter your markdown here..."
                ></textarea>
            </div>
            <div class="container" id="htmlContainer">
                <h2>Raw HTML Output:</h2>
                <div id="html-output"></div>
            </div>
            <div class="container" id="previewContainer">
                <h2>HTML Preview:</h2>
                <div id="preview"></div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
